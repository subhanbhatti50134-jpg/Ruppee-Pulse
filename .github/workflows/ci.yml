name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-tests-backend:
    name: Backend — lint + tests (FastAPI, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: APis/requirements.txt

      - name: Install backend dependencies
        working-directory: APis
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pytest

      - name: Ruff lint
        working-directory: APis
        run: ruff check app tests

      - name: Run pytest suite (offline, seeded tickers)
        working-directory: APis
        run: python -m pytest

  lint-and-build-frontend:
    name: Frontend — lint + build (React + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Lint (oxlint)
        working-directory: ui
        run: npx oxlint

      - name: Production build
        working-directory: ui
        run: npm run build
