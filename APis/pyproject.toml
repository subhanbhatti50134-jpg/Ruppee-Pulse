[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["venv", "data", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "W"]
ignore = ["B008"]  # Depends() in defaults is the FastAPI idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # env vars must be set before app imports in conftest

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
